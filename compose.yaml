name: factory-traffic

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: factory_traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_demo_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d factory_traffic"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://traffic:${POSTGRES_PASSWORD:-traffic_demo_only}@postgres:5432/factory_traffic?sslmode=disable
      HTTP_ADDR: :8080
      APP_VERSION: 1.0.0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  simulator:
    profiles: ["simulation"]
    build: ./tools
    environment:
      API_URL: http://backend:8080
    volumes:
      - simulator_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  simulator_data:
